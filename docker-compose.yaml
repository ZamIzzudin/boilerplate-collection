version: "3"
services:
  app:
    image: DOCKER_REGISTRY/PROJECT_NAME:TAG
    ports:
      - PROJECT_PORT:80
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 250M
    networks:
      - swarm-network-1
    volumes:
      - /home/docker/volumes/nutech_boilerplate_shared:/usr/local/apache2/htdocs/public/uploads
    env_file:
      - .env-dev

networks:
  swarm-network-1:
    external: true